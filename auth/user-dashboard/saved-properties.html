<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Properties | Starline</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/admin-dashboard.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/logos/favicon.svg">
    <link rel="shortcut icon" href="../../assets/favicon.ico">
    <script src="../../src/js/admin-state.js" defer></script>
    <script src="../../src/js/user-dashboard-logic.js" defer></script>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <a href="../../index.html" style="text-decoration: none; color: inherit;">Starline</a>
            </div>
            <nav class="sidebar-menu">
                <a href="index.html" class="menu-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="saved-properties.html" class="menu-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <span>My Properties</span>
                </a>
                <a href="profile.html" class="menu-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>Profile</span>
                </a>
                <a href="inquiries.html" class="menu-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    <span>History</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="../../index.html?logout=true" class="menu-link" style="color: #ff7675;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <header class="content-header">
                <div class="header-title">
                    <h1>Saved Properties</h1>
                    <p>Your curated collection of exclusive real estate listings.</p>
                </div>
                <div id="current-date" style="font-weight: 600; font-size: 0.9rem; color: var(--admin-text-muted);">
                </div>
            </header>

            <section class="table-card">
                <div id="saved-grid"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;">
                    <!-- Dynamic items -->
                    <div class="stat-card" style="text-align: center; padding: 60px;">
                        <p style="color: var(--admin-text-muted); margin-bottom: 20px;">Your collection is currently
                            empty.</p>
                        <a href="../../public/pages/listings.html" class="menu-link active"
                            style="display: inline-flex; text-decoration: none; padding: 12px 25px;">Browse
                            Properties</a>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <!-- Scripts -->
    <script src="../../src/js/ui-utils.js"></script>
    <script src="../../src/js/admin-state.js"></script>
    <script src="../../src/js/user-dashboard-logic.js"></script>
</body>

</html>
