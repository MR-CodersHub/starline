<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Starline</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
    <script src="../src/js/admin-state.js" defer></script>
    <script src="../src/js/auth.js" defer></script>
    <style>
        .auth-layout {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
        }

        .auth-visual {
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
        }

        .auth-form-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: var(--bg-soft);
        }

        .auth-box {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            padding: 50px;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }

        .auth-input {
            width: 100%;
            padding: 15px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            font-family: inherit;
            outline: none;
        }

        @media (max-width: 900px) {
            .auth-layout {
                grid-template-columns: 1fr;
            }

            .auth-visual {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="auth-layout">
        <div class="auth-visual"></div>
        <div class="auth-form-container">
            <div class="auth-box">
                <div class="logo" style="margin-bottom: 40px;">
                    <a href="../index.html"
                        style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2Z M12 8.5L9.5 12L12 15.5L14.5 12Z" fill="currentColor" stroke="none"></path>
                        </svg>
                        <span style="font-weight: 800; letter-spacing: -0.5px;">Starline</span>
                    </a>
                </div>
                <h1 style="font-size: 2.25rem; margin-bottom: 8px;">Begin Discovery.</h1>
                <p style="color: var(--text-muted); margin-bottom: 40px;">Join an exclusive network of global observers.
                </p>

                <div id="error-message" style="display: none;"></div>

                <form id="signup-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label
                                style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">First
                                Name</label>
                            <input type="text" id="first-name" placeholder="John" class="auth-input"
                                style="margin-bottom: 0;" required>
                        </div>
                        <div>
                            <label
                                style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Last
                                Name</label>
                            <input type="text" id="last-name" placeholder="Doe" class="auth-input"
                                style="margin-bottom: 0;" required>
                        </div>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Email
                            Address</label>
                        <input type="email" id="email" placeholder="name@company.com" class="auth-input" required>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label
                            style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 10px;">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Min. 8 characters" class="auth-input"
                                style="margin-bottom: 0;" required>
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('password')">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label
                            style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 10px;">Confirm
                            Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" placeholder="Repeat password"
                                class="auth-input" style="margin-bottom: 0;" required>
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('confirm-password')">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div
                        style="display: flex; gap: 10px; margin-bottom: 30px; font-size: 0.85rem; color: var(--text-muted);">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="../terms.html" style="color: var(--text-main);">Terms of
                                Service</a>
                            and <a href="../privacy.html" style="color: var(--text-main);">Privacy Policy</a>.</span>
                    </div>

                    <button type="submit" class="nav-cta" style="margin: 0; width: 100%; padding: 16px;">Create
                        Account</button>

                    <div style="text-align: center; margin-top: 30px; font-size: 0.9rem;">
                        <span style="color: var(--text-muted);">Already have an account?</span>
                        <a href="../login.html"
                            style="color: var(--text-main); font-weight: 700; text-decoration: none;">Sign In</a>
                    </div>

                    <div style="position: relative; margin-top: 40px; text-align: center;">
                        <hr style="border: 0; border-top: 1px solid var(--border-soft);">
                        <span
                            style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--bg-main); padding: 0 15px; font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px;">Or
                            continue with</span>
                    </div>

                    <div class="social-auth" style="display: grid; gap: 15px; margin-top: 30px;">
                        <button class="social-btn" type="button"
                            style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--border-radius-sm); background: var(--white); cursor: pointer; font-size: 0.9rem; font-weight: 500;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M17.05 20.28c-.98.95-2.05 1.74-3.14 1.72-1.09-.03-1.42-.69-2.73-.69-1.31 0-1.7.67-2.71.7-1.07.03-2.2-.84-3.23-1.87-2.11-2.09-3.7-5.91-1.63-9.5 1.03-1.78 2.86-2.9 4.88-2.93 1.54-.03 3 .89 3.91.89.92 0 2.65-1.13 4.54-.92 1.78.07 3.14.73 3.86 1.78-3.41 1.76-2.85 6.33.6 8.02-.75 1.8-1.55 3.59-3.33 5.3M12.03 7.25c-.02-2.14 1.72-4 3.79-4.14.23 2.49-2.24 4.5-3.79 4.14" />
                            </svg>
                            Apple
                        </button>
                        <button class="social-btn" type="button"
                            style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--border-radius-sm); background: var(--white); cursor: pointer; font-size: 0.9rem; font-weight: 500;">
                            <span style="font-size: 1.2rem; font-weight: 800;">G</span> Google
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>

</html>
